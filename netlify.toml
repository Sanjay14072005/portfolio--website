[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/auth/token"
  to = "/.netlify/functions/auth-token"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat/history"
  to = "/.netlify/functions/chat-history"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/chat"
  to = "/chat.html"
  status = 200
